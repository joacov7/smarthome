##############################################################
#  SMART RENTAL — Dashboard Propietario
#  Lovelace YAML listo para importar en Home Assistant
#
#  Cómo instalar:
#    HA → Ajustes → Paneles → Añadir panel → Lovelace desde YAML
#    Pegar este archivo o editar ui-lovelace.yaml
#
#  Entidades a personalizar (buscar y reemplazar):
#    switch.cerradura_entrada  → tu relay de cerradura
#    switch.energia_zona_1     → relay corte energía 1
#    switch.energia_zona_2     → relay corte energía 2
#    binary_sensor.puerta_entrada
#    binary_sensor.ventana_principal
#    binary_sensor.detector_humo
#    binary_sensor.sensor_agua
#    sensor.consumo_energia    → si tenés medidor de energía
##############################################################

title: Smart Rental
views:

  # ──────────────────────────────────────────────────────────
  #  VISTA PRINCIPAL — El propietario ve esto primero
  # ──────────────────────────────────────────────────────────
  - title: Propiedad
    path: propiedad
    icon: mdi:home-city
    cards:

      # ── Estado general ──────────────────────────────────
      - type: markdown
        content: >
          {% set alarmas = namespace(count=0) %}
          {% if is_state('binary_sensor.detector_humo', 'on') %}
            {% set alarmas.count = alarmas.count + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.sensor_agua', 'on') %}
            {% set alarmas.count = alarmas.count + 1 %}
          {% endif %}
          {% if alarmas.count == 0 %}
          ## ✅ Propiedad OK
          Todo en orden. Sin alertas activas.
          {% else %}
          ## 🚨 {{ alarmas.count }} alerta(s) activa(s)
          Revisar sección de seguridad.
          {% endif %}

      # ── Acceso rápido ────────────────────────────────────
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### 🔐 Control de Acceso"
          - type: horizontal-stack
            cards:
              - type: button
                name: Abrir cerradura
                icon: mdi:lock-open
                entity: switch.cerradura_entrada
                tap_action:
                  action: call-service
                  service: switch.turn_on
                  target:
                    entity_id: switch.cerradura_entrada
                icon_height: 48px
                card_mod:
                  style: |
                    ha-card {
                      background: #1a3a1a;
                      border: 2px solid #4caf50;
                    }
              - type: button
                name: Bloquear
                icon: mdi:lock
                entity: switch.cerradura_entrada
                tap_action:
                  action: call-service
                  service: switch.turn_off
                  target:
                    entity_id: switch.cerradura_entrada
                icon_height: 48px
                card_mod:
                  style: |
                    ha-card {
                      background: #3a1a1a;
                      border: 2px solid #f44336;
                    }

      # ── Sensores de seguridad ────────────────────────────
      - type: glance
        title: Seguridad
        columns: 2
        show_state: true
        entities:
          - entity: binary_sensor.puerta_entrada
            name: Puerta entrada
            icon: mdi:door
          - entity: binary_sensor.ventana_principal
            name: Ventana
            icon: mdi:window-closed
          - entity: binary_sensor.detector_humo
            name: Detector humo
            icon: mdi:smoke-detector
          - entity: binary_sensor.sensor_agua
            name: Sensor agua
            icon: mdi:water-alert

      # ── Corte de energía ─────────────────────────────────
      - type: entities
        title: Energía
        entities:
          - entity: switch.energia_zona_1
            name: Zona 1 — General
            icon: mdi:power-socket
          - entity: switch.energia_zona_2
            name: Zona 2 — Aire acondicionado
            icon: mdi:air-conditioner
          - type: divider
          - entity: sensor.consumo_energia
            name: Consumo actual
            icon: mdi:flash

      # ── Historial rápido ─────────────────────────────────
      - type: logbook
        title: Últimos eventos
        hours_to_show: 24
        entities:
          - switch.cerradura_entrada
          - binary_sensor.puerta_entrada
          - binary_sensor.detector_humo
          - binary_sensor.sensor_agua

  # ──────────────────────────────────────────────────────────
  #  VISTA INQUILINOS
  # ──────────────────────────────────────────────────────────
  - title: Inquilino
    path: inquilino
    icon: mdi:account-key
    cards:

      - type: markdown
        content: "### 👤 Gestión de Inquilino"

      - type: entities
        title: Acceso actual
        entities:
          - entity: input_boolean.inquilino_activo
            name: Inquilino activo
            icon: mdi:account-check
          - entity: input_text.nombre_inquilino
            name: Nombre
            icon: mdi:account
          - entity: input_text.telefono_inquilino
            name: Teléfono
            icon: mdi:phone

      - type: horizontal-stack
        cards:
          - type: button
            name: Alta inquilino
            icon: mdi:account-plus
            tap_action:
              action: call-service
              service: input_boolean.turn_on
              target:
                entity_id: input_boolean.inquilino_activo
          - type: button
            name: Baja inquilino
            icon: mdi:account-remove
            tap_action:
              action: call-service
              service: script.baja_inquilino

      - type: markdown
        content: >
          **Al dar de baja al inquilino:**
          - Se cambia el código de acceso
          - Se corta la energía de zonas no esenciales
          - Se activa modo vigilancia

  # ──────────────────────────────────────────────────────────
  #  VISTA HISTORIAL Y REPORTES
  # ──────────────────────────────────────────────────────────
  - title: Historial
    path: historial
    icon: mdi:chart-line
    cards:

      - type: history-graph
        title: Energía — últimos 7 días
        hours_to_show: 168
        entities:
          - entity: sensor.consumo_energia
            name: Consumo kWh

      - type: history-graph
        title: Accesos — últimas 24h
        hours_to_show: 24
        entities:
          - entity: binary_sensor.puerta_entrada
            name: Puerta entrada
          - entity: switch.cerradura_entrada
            name: Cerradura

      - type: logbook
        title: Registro completo
        hours_to_show: 168
        entities:
          - switch.cerradura_entrada
          - binary_sensor.puerta_entrada
          - binary_sensor.ventana_principal
          - binary_sensor.detector_humo
          - binary_sensor.sensor_agua
          - switch.energia_zona_1
          - switch.energia_zona_2
