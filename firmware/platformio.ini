; ============================================================
;  Nido — Sistema Modular ESP32
;  Hardware: Waveshare ESP32-S3 Zero
; ============================================================

[env:esp32s3_zero]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3 Zero: 4 MB flash, sin PSRAM, USB nativo
board_build.flash_size       = 4MB
board_build.partitions       = default.csv
board_upload.flash_size      = 4MB
board_upload.maximum_size    = 4194304

; USB nativo — sin chip UART externo
; -DARDUINO_USB_CDC_ON_BOOT=1 → Serial funciona por USB sin adaptador
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Librerías
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; ── Para flashear la primera vez ────────────────────────
;  1. Mantené presionado BOOT
;  2. Conectá el USB-C
;  3. Soltá BOOT → el S3 queda en modo bootloader
;  4. Ejecutá: pio run -t upload
;  Después del primer flash, el auto-reset funciona solo.
